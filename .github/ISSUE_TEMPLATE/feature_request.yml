name: Feature request
description: Propose an enhancement or new feature
labels: ["enhancement"]
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the form below to help us understand your proposal.

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is your feature request related to a problem?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen
      placeholder: |
        I would like to see...
        The feature should work by...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternatives you've considered or workarounds you're currently using
      placeholder: |
        Alternative 1: ...
        Alternative 2: ...
        Current workaround: ...

  - type: textarea
    id: scope
    attributes:
      label: Scope and Complexity
      description: |
        What parts of the codebase would be affected?
        How complex do you think this feature is to implement?
      placeholder: |
        Affected components:
        - Lab scripts
        - Documentation
        - New dependencies
        
        Estimated complexity: Low/Medium/High

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
      description: What should NOT be included in this feature?
      placeholder: This feature should not include...

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical - Blocking my work
        - High - Very important
        - Medium - Would be nice to have
        - Low - Not urgent
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Describe specific scenarios where this feature would be useful
      placeholder: |
        Use case 1: When processing large batches...
        Use case 2: For educational demonstrations...
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Examples / Mockups
      description: |
        Provide code examples, screenshots, or mockups if applicable
      placeholder: |
        ```matlab
        % Example usage
        result = newFeature(input);
        ```
      render: matlab

  - type: textarea
    id: risks
    attributes:
      label: Potential Risks / Breaking Changes
      description: Could this feature introduce breaking changes or risks?
      placeholder: |
        This might affect...
        Backward compatibility concerns...

  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: Who would benefit from this feature and how?
      placeholder: |
        - Students learning image processing
        - Researchers working on...
        - Users who need to...

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, links, or references about the feature request
      placeholder: |
        Related resources:
        - Link to paper/article
        - Similar implementation in other projects
        - Related issues: #...

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following before submitting
      options:
        - label: I have searched existing issues and feature requests
          required: true
        - label: I have provided a clear problem statement and proposed solution
          required: true
        - label: This feature aligns with the project's goals and scope
          required: true
